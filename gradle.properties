# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Java 21: NeoForge 1.21.1 requires JDK 21. Point Gradle at the JDK that is
# already installed on this machine so foojay does not download one.
# ---------------------------------------------------------------------------
org.gradle.java.home=C:/Users/Administrator/AppData/Local/Programs/Microsoft/jdk-21.0.11.10-hotspot
org.gradle.java.installations.paths=C:/Users/Administrator/AppData/Local/Programs/Microsoft/jdk-21.0.11.10-hotspot
org.gradle.java.installations.auto-download=false

# Local VPN/Clash HTTP proxy (used by Gradle for online dependency resolution)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
