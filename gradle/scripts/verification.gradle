import groovy.json.JsonSlurper
import java.util.zip.ZipFile

def releaseJars = ['fabric', 'neoforge'].collectEntries { loader ->
    [(loader): project(":${loader}").tasks.named('remapJar').flatMap { it.archiveFile }]
}
def expectedModId = rootProject.mod_id.toString()
def expectedVersion = rootProject.version.toString()

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    description = 'Rejects direct loader imports in common code.'
    def sharedSources = fileTree('common/src/main/java') { include '**/*.java' }
    inputs.files(sharedSources)
    doLast {
        sharedSources.each { source ->
            if (source.getText('UTF-8') =~ /(?m)^import\s+net\.(fabricmc|neoforged)\./) {
                throw new GradleException("Loader API leaked into common: ${source}")
            }
        }
    }
}

tasks.register('verifyReleaseJars') {
    group = 'verification'
    description = 'Checks both release jars for shared assets, platform isolation and external dependencies.'
    dependsOn ':fabric:remapJar', ':neoforge:remapJar'
    inputs.files(releaseJars.values())
    doLast {
        releaseJars.each { loader, archiveFile ->
            def jarFile = archiveFile.get().asFile
            new ZipFile(jarFile).withCloseable { zip ->
                def sharedPackage = 'com/shu0cheng/umbrellamod/'
                def provider = "com.shu0cheng.umbrellamod.${loader}.${loader == 'fabric' ? 'FabricPlatform' : 'NeoForgePlatform'}"
                def service = 'META-INF/services/com.shu0cheng.umbrellamod.platform.UmbrellaPlatform'
                def required = [
                    sharedPackage + 'UmbrellaMod.class',
                    sharedPackage + 'item/UmbrellaItem.class',
                    sharedPackage + 'platform/Services.class',
                    provider.replace('.', '/') + '.class',
                    service, 'umbrella.mixins.json', 'umbrella_logo.png',
                    'assets/umbrella/sounds.json',
                    'assets/umbrella/geo/item/telescopic_umbrella.geo.json',
                    'assets/umbrella/animations/item/block_empty.animation.json',
                    'data/umbrella/recipe/oil_paper_umbrella.json',
                    loader == 'fabric' ? 'fabric.mod.json' : 'META-INF/neoforge.mods.toml'
                ]
                required.each { name ->
                    if (zip.getEntry(name) == null) throw new GradleException("${jarFile.name}: missing ${name}")
                }
                if (zip.getInputStream(zip.getEntry(service)).getText('UTF-8').trim() != provider) {
                    throw new GradleException("${jarFile.name}: wrong platform service provider")
                }
                def otherLoader = loader == 'fabric' ? 'neoforge' : 'fabric'
                zip.entries().each { entry ->
                    if (entry.name.startsWith(sharedPackage + otherLoader + '/')
                            || entry.name.startsWith('software/bernie/geckolib/')
                            || entry.name.endsWith('.jar')) {
                        throw new GradleException("${jarFile.name}: unexpected bundled entry ${entry.name}")
                    }
                }
                def metadataName = loader == 'fabric' ? 'fabric.mod.json' : 'META-INF/neoforge.mods.toml'
                def metadata = zip.getInputStream(zip.getEntry(metadataName)).getText('UTF-8')
                if (metadata.contains('$' + '{')) throw new GradleException("${jarFile.name}: unexpanded metadata")
                if (loader == 'fabric') {
                    def json = new JsonSlurper().parseText(metadata)
                    if (json.id != expectedModId || json.version != expectedVersion) {
                        throw new GradleException("${jarFile.name}: wrong Fabric mod identity")
                    }
                }
                logger.lifecycle("Verified release jar: ${jarFile.name}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyCommonIsolation', 'verifyReleaseJars', ':common:check'
}
