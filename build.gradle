plugins {
    id 'base'
    id 'dev.architectury.loom' version '1.17.493' apply false
    id 'architectury-plugin' version '3.5.170'
    id 'com.gradleup.shadow' version '8.3.11' apply false
}

architectury { minecraft = minecraft_version }

allprojects {
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
    repositories {
        mavenCentral()
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content { includeGroup 'software.bernie.geckolib' }
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply from: rootProject.file('gradle/scripts/java.gradle')
    base { archivesName = "${rootProject.archives_name}-${project.name}" }
    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }
tasks.named('clean') { dependsOn ':common:clean', ':fabric:clean', ':neoforge:clean' }

tasks.register('collectReleaseJars', Sync) {
    group = 'build'
    description = 'Collects both loader release jars into build/libs.'
    dependsOn ':fabric:remapJar', ':neoforge:remapJar'
    from project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }
    from project(':neoforge').tasks.named('remapJar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('libs')
}
tasks.named('assemble') { dependsOn 'collectReleaseJars' }

apply from: rootProject.file('gradle/scripts/verification.gradle')
